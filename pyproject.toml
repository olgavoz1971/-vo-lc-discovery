[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vo-lc-discovery"
version = "0.0.1"
description = "Discovery of lightcurve routes in the Virtual Observatory"
requires-python = ">=3.10"
dependencies = ["pyvo", "astropy", "numpy", "mocpy"]

[project.optional-dependencies]
test = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/vo_lc_discovery"]
